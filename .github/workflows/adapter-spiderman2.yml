name: Spider-Man 2 adapter

on:
  pull_request:
    paths:
      - "adapters/spiderman2/**"
      - ".github/workflows/adapter-spiderman2.yml"
  push:
    branches: [main]
    paths:
      - "adapters/spiderman2/**"
      - ".github/workflows/adapter-spiderman2.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: adapters/spiderman2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
